name: Publish

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # sanchpet-hev mints an hour-long token for the engine repo only; its key does not expire.
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.HEV_CLIENT_ID }}
          private-key: ${{ secrets.HEV_APP_KEY }}
          owner: sanchpet
          repositories: garden
          permission-contents: write
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/sanchpet/garden/dispatches -f event_type=garden-texts
